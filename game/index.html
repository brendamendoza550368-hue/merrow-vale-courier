<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merrow Vale Courier — a bush-plane flight game</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<div id="stage">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="hud-top">
    <div class="hud-cell"><span class="hud-label">ALT</span><span id="hud-alt" class="hud-value">0</span><span class="hud-unit">ft</span></div>
    <div class="hud-cell"><span class="hud-label">SPD</span><span id="hud-spd" class="hud-value">0</span><span class="hud-unit">kt</span></div>
    <div class="hud-cell"><span class="hud-label">HDG</span><span id="hud-hdg" class="hud-value">000</span><span class="hud-unit">&deg;</span></div>
    <div class="hud-cell"><span class="hud-label">FUEL</span><span id="hud-fuel" class="hud-value">100</span><span class="hud-unit">%</span></div>
    <div class="hud-cell"><span class="hud-label">SCORE</span><span id="hud-score" class="hud-value">0</span></div>
  </div>
  <div id="hud-mission">MERROW VALE COURIER</div>
  <div id="hud-message"></div>
  <div id="hud-help">Arrows / WASD fly &middot; Shift/Ctrl or E/Q throttle &middot; mouse steers &middot; wheel throttle &middot; Space brake &middot; M mission &middot; Enter start &middot; R restart</div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
